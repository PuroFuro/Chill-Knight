# Optional: spin up the PostgreSQL the project spec asks for.
#   docker compose up -d
# Then in backend/.env set:
#   DATABASE_URL=postgresql+asyncpg://chill:chill@localhost:5432/chill_knight
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chill
      POSTGRES_PASSWORD: chill
      POSTGRES_DB: chill_knight
    ports:
      - "5432:5432"
    volumes:
      - chill_pg:/var/lib/postgresql/data

volumes:
  chill_pg:
